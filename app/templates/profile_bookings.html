<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رزروهای من | بومگردی</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f5f0e6;
            color: #3e2723;
            font-family: "Vazirmatn", "IRANSans", "Segoe UI", Tahoma, Arial, sans-serif;
            font-size: 14px;
            -webkit-font-smoothing: antialiased;
        }

        a { color: inherit; text-decoration: none; }
        button { font-family: inherit; }
        svg { display: block; }
        p, h1, h2, h3 { margin: 0; }

        .hidden { display: none !important; }

        .header {
            position: sticky;
            top: 0;
            z-index: 20;
            border-bottom: 1px solid #d7ccc8;
            background: rgba(253, 251, 247, 0.92);
            backdrop-filter: blur(10px);
        }

        .header-inner {
            max-width: 1080px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 12px;
            height: 66px;
            padding: 0 18px;
        }

        .brand { display: flex; align-items: center; gap: 11px; }

        .brand-logo {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: #6f4e37;
            border: 1px solid #4e342e;
            box-shadow: 0 8px 18px rgba(78, 52, 46, 0.25);
        }

        .brand-logo svg { width: 20px; height: 20px; stroke: #f5f0e6; fill: none; }

        .brand-name { display: block; font-size: 14px; font-weight: 700; color: #3e2723; }
        .brand-note { display: block; font-size: 11px; color: #6f4e37; margin-top: 2px; }

        .nav { margin-right: auto; display: none; align-items: center; gap: 6px; }

        .nav-link {
            padding: 8px 13px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            color: #6f4e37;
            transition: background 0.18s ease, color 0.18s ease;
        }

        .nav-link:hover { background: #f5f0e6; color: #3e2723; }
        .nav-link.current { background: #f5f0e6; color: #3e2723; box-shadow: inset 0 0 0 1px #d7ccc8; }

        .logout-btn {
            margin-right: auto;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 9px 14px;
            border: 1px solid #d7ccc8;
            border-radius: 11px;
            background: #fdfbf7;
            color: #3e2723;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(62, 39, 35, 0.06);
            transition: border-color 0.18s ease, background 0.18s ease, color 0.18s ease;
        }

        .logout-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; }
        .logout-btn:hover { border-color: #6f4e37; background: #f5f0e6; color: #4e342e; }

        .content { max-width: 1080px; margin: 0 auto; padding: 26px 18px 40px; }

        .page-head {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 18px;
        }

        .page-title { font-size: 20px; font-weight: 700; color: #3e2723; }
        .page-subtitle { margin-top: 6px; font-size: 13px; line-height: 1.9; color: #6f4e37; }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            border: 1px solid #4e342e;
            border-radius: 12px;
            background: #6f4e37;
            color: #f5f0e6;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(111, 78, 55, 0.22);
            transition: background 0.18s ease, box-shadow 0.18s ease;
        }

        .btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; }
        .btn:hover { background: #4e342e; }
        .btn:disabled { opacity: 0.65; cursor: not-allowed; box-shadow: none; }

        .booking-list { display: grid; grid-template-columns: 1fr; gap: 14px; }

        .booking {
            background: #ffffff;
            border: 1px solid #d7ccc8;
            border-radius: 18px;
            box-shadow: 0 1px 2px rgba(62, 39, 35, 0.06);
            overflow: hidden;
            transition: box-shadow 0.2s ease;
        }

        .booking:hover { box-shadow: 0 12px 26px rgba(62, 39, 35, 0.1); }

        .booking-head {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 16px 18px;
            border-bottom: 1px solid #d7ccc8;
            background: #fdfbf7;
        }

        .booking-title { font-size: 15px; font-weight: 700; color: #3e2723; }
        .booking-city { margin-top: 4px; font-size: 12px; color: #6f4e37; }

        .booking-body { padding: 16px 18px; }

        .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .fact-label { font-size: 11.5px; color: #6f4e37; }
        .fact-value { margin-top: 5px; font-size: 13.5px; font-weight: 600; color: #3e2723; }
        .fact-value.ltr { direction: ltr; text-align: right; font-size: 12px; font-weight: 500; color: rgba(62, 39, 35, 0.6); }

        .booking-foot {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 13px 18px;
            border-top: 1px solid rgba(215, 204, 200, 0.7);
            font-size: 12.5px;
            color: #6f4e37;
        }

        .total { font-size: 13px; font-weight: 700; color: #4e342e; }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 11px;
            border-radius: 999px;
            font-size: 11.5px;
            font-weight: 600;
            border: 1px solid #d7ccc8;
            white-space: nowrap;
        }

        .badge-pending { background: #f5f0e6; color: #6f4e37; }
        .badge-confirmed { background: #4e342e; color: #f5f0e6; border-color: #3e2723; }
        .badge-cancelled { background: #fdfbf7; color: #4e342e; }

        .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

        .alert {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            margin-bottom: 16px;
            padding: 11px 14px;
            border-radius: 13px;
            border: 1px solid #d7ccc8;
            background: #fdfbf7;
            color: #4e342e;
            font-size: 13px;
            line-height: 1.8;
        }

        .alert svg { width: 17px; height: 17px; flex: 0 0 auto; margin-top: 3px; stroke: currentColor; fill: none; }

        .state {
            padding: 44px 22px;
            text-align: center;
            background: #ffffff;
            border: 1px solid #d7ccc8;
            border-radius: 18px;
        }

        .state-title { font-size: 14px; font-weight: 700; color: #3e2723; }
        .state-text { margin-top: 6px; font-size: 12.5px; line-height: 1.9; color: #6f4e37; }
        .state-text a { color: #6f4e37; font-weight: 700; text-decoration: underline; }

        .skeleton-card {
            height: 168px;
            border-radius: 18px;
            background: #ffffff;
            border: 1px solid #d7ccc8;
            animation: pulse 1.4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.55; }
        }

        .site-footer { margin-top: 28px; text-align: center; font-size: 11.5px; color: #6f4e37; }

        @media (min-width: 640px) {
            .content { padding: 28px 24px 44px; }
            .nav { display: flex; }
            .logout-btn { margin-right: 0; }
            .booking-list { grid-template-columns: repeat(2, 1fr); }
        }

        @media (min-width: 1024px) {
            .booking-list { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

<header class="header">
    <div class="header-inner">
        <a href="/profile" class="brand">
            <span class="brand-logo">
                <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 3.75 3.75 9v10.5a.75.75 0 0 0 .75.75h4.5V15a3 3 0 0 1 6 0v5.25h4.5a.75.75 0 0 0 .75-.75V9L12 3.75Z"/>
                </svg>
            </span>
            <span>
                <span class="brand-name">بومگردی</span>
                <span class="brand-note">حساب کاربری</span>
            </span>
        </a>

        <nav class="nav" aria-label="ناوبری">
            <a href="/profile" class="nav-link">داشبورد</a>
            <a href="/profile/bookings" class="nav-link current">رزروهای من</a>
            <a href="/" class="nav-link">صفحه اصلی</a>
        </nav>

        <button id="logout-button" type="button" class="logout-btn">
            <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l-3 3m0 0 3 3m-3-3h12.75"/>
            </svg>
            خروج
        </button>
    </div>
</header>

<main class="content">
    <div class="page-head">
        <div>
            <h1 class="page-title">رزروهای من</h1>
            <p id="page-caption" class="page-subtitle">در حال دریافت رزروها…</p>
        </div>
        <button id="refresh-button" type="button" class="btn">
            <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992V4.356m0 4.992-3.183-3.183a8.25 8.25 0 0 0-13.803 3.7M2.985 19.644v-4.992m0 0h4.992m-4.992 0 3.183 3.182a8.25 8.25 0 0 0 13.803-3.7"/>
            </svg>
            بروزرسانی
        </button>
    </div>

    <div id="page-error" class="alert hidden" role="alert">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m0 3h.008M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/>
        </svg>
        <span id="page-error-text"></span>
    </div>

    <div id="my-bookings-body" class="booking-list">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
    </div>

    <div id="empty-state" class="state hidden">
        <p class="state-title">هنوز رزروی ثبت نکرده‌اید</p>
        <p class="state-text">از صفحه اصلی یک اقامتگاه انتخاب کنید و اولین اقامت خود را رزرو کنید.
            <a href="/">مشاهده اقامتگاه‌ها</a></p>
    </div>
</main>

<script src="/static/js/jalali.js"></script>

<footer class="site-footer">بومگردی — سامانه رزرو اقامتگاه‌های بومگردی © ۱۴۰۵</footer>

<script>
(function () {
    'use strict';

    const TOKEN_KEY = 'access_token';
    const USER_KEY = 'current_user';

    const token = localStorage.getItem(TOKEN_KEY);
    if (!token) {
        window.location.replace('/login');
        return;
    }

    const listBody = document.getElementById('my-bookings-body');
    const caption = document.getElementById('page-caption');
    const emptyState = document.getElementById('empty-state');
    const errorBox = document.getElementById('page-error');
    const errorText = document.getElementById('page-error-text');
    const refreshButton = document.getElementById('refresh-button');

    const STATUS_META = {
        pending: { label: 'در انتظار تأیید', className: 'badge-pending' },
        confirmed: { label: 'تأییدشده', className: 'badge-confirmed' },
        cancelled: { label: 'لغوشده', className: 'badge-cancelled' }
    };

    function escapeHtml(value) {
        return String(value === null || value === undefined ? '' : value).replace(/[&<>"']/g, function (char) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char];
        });
    }

    // Calendar days are displayed in the Persian calendar (ADR 0008).
    function formatStay(value) {
        return JalaliDate.format(value) || '—';
    }

    function formatPrice(value) {
        const number = Number(value);
        if (!isFinite(number)) { return '—'; }
        return number.toLocaleString('fa-IR') + ' تومان';
    }

    function nightsBetween(checkIn, checkOut) {
        if (!checkIn || !checkOut) { return 0; }
        const nights = Math.round(
            (new Date(checkOut + 'T00:00:00Z') - new Date(checkIn + 'T00:00:00Z')) / 86400000
        );
        return isFinite(nights) && nights > 0 ? nights : 0;
    }

    function statusBadge(status) {
        const meta = STATUS_META[status] || { label: status || '—', className: 'badge-cancelled' };
        return '<span class="badge ' + meta.className + '"><span class="dot"></span>'
            + escapeHtml(meta.label) + '</span>';
    }

    function bookingCard(booking) {
        const nights = nightsBetween(booking.check_in, booking.check_out);
        const total = nights * Number(booking.price_per_night || 0);

        return '<article class="booking">'
            + '<div class="booking-head">'
            + '<div>'
            + '<h2 class="booking-title">' + escapeHtml(booking.listing_title) + '</h2>'
            + '<p class="booking-city">' + escapeHtml(booking.listing_city) + ' · ' + escapeHtml(booking.room_name) + '</p>'
            + '</div>'
            + statusBadge(booking.status)
            + '</div>'
            + '<div class="booking-body">'
            + '<div class="facts">'
            + '<div><p class="fact-label">تاریخ ورود</p><p class="fact-value">' + escapeHtml(formatStay(booking.check_in)) + '</p></div>'
            + '<div><p class="fact-label">تاریخ خروج</p><p class="fact-value">' + escapeHtml(formatStay(booking.check_out)) + '</p></div>'
            + '<div><p class="fact-label">شب‌ها</p><p class="fact-value">' + nights.toLocaleString('fa-IR') + ' شب</p></div>'
            + '<div><p class="fact-label">شناسه رزرو</p><p class="fact-value ltr">' + escapeHtml(booking.id) + '</p></div>'
            + '</div>'
            + '</div>'
            + '<div class="booking-foot">'
            + '<span>' + escapeHtml(formatPrice(booking.price_per_night)) + ' هر شب</span>'
            + '<span class="total">مجموع: ' + escapeHtml(formatPrice(total)) + '</span>'
            + '</div>'
            + '</article>';
    }

    function render(bookings) {
        caption.textContent = bookings.length.toLocaleString('fa-IR') + ' رزرو ثبت کرده‌اید';

        if (bookings.length === 0) {
            listBody.innerHTML = '';
            listBody.classList.add('hidden');
            emptyState.classList.remove('hidden');
            return;
        }

        emptyState.classList.add('hidden');
        listBody.classList.remove('hidden');
        listBody.innerHTML = bookings.map(bookingCard).join('');
    }

    function showError(message) {
        errorText.textContent = message;
        errorBox.classList.remove('hidden');
    }

    function logout() {
        localStorage.removeItem(TOKEN_KEY);
        localStorage.removeItem(USER_KEY);
        localStorage.removeItem('token_type');
        window.location.replace('/');
    }

    async function loadBookings() {
        refreshButton.disabled = true;
        errorBox.classList.add('hidden');

        try {
            const response = await fetch('/api/v1/bookings/mine', {
                headers: { Authorization: 'Bearer ' + token, Accept: 'application/json' }
            });

            if (response.status === 401) {
                logout();
                return;
            }
            if (!response.ok) {
                throw new Error('Unexpected status ' + response.status);
            }

            render(await response.json());
        } catch (error) {
            listBody.innerHTML = '';
            caption.textContent = 'خطا در دریافت اطلاعات';
            showError('ارتباط با سرور برقرار نشد؛ اتصال خود را بررسی کنید.');
        } finally {
            refreshButton.disabled = false;
        }
    }

    refreshButton.addEventListener('click', loadBookings);
    document.getElementById('logout-button').addEventListener('click', logout);

    loadBookings();
})();
</script>
</body>
</html>
